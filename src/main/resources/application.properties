spring.application.name=Ai-learn
spring.config.import=optional:file:./.env[.properties]
spring.jersey.application-path=/api
langchain4j.open-ai.streaming-chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.streaming-chat-model.model-name=${OPENAI_MODEL:gpt-4o}
langchain4j.open-ai.streaming-chat-model.timeout=${OPENAI_TIMEOUT:60s}
langchain4j.open-ai.streaming-chat-model.max-completion-tokens=${OPENAI_MAX_COMPLETION_TOKENS:1000}
langchain4j.open-ai.streaming-chat-model.log-requests=false
langchain4j.open-ai.streaming-chat-model.log-responses=false
app.chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:20}
app.chat.recovery-scan-interval=${CHAT_RECOVERY_SCAN_INTERVAL:10s}
app.chat.sse.heartbeat-interval=${CHAT_SSE_HEARTBEAT_INTERVAL_MS:15000}
app.chat.outbox.recovery-interval=${CHAT_OUTBOX_RECOVERY_INTERVAL:10s}
app.chat.outbox.batch-size=${CHAT_OUTBOX_BATCH_SIZE:100}
app.chat.outbox.retention=${CHAT_OUTBOX_RETENTION:7d}
app.chat.outbox.cleanup-interval=${CHAT_OUTBOX_CLEANUP_INTERVAL:1h}
app.chat.redis.enabled=${CHAT_REDIS_ENABLED:false}
app.chat.events.retention=${CHAT_EVENT_RETENTION:24h}
app.chat.events.max-per-run=${CHAT_EVENT_MAX_PER_RUN:2000}
app.chat.websocket.send-time-limit=${CHAT_WEBSOCKET_SEND_TIME_LIMIT_MS:10000}
app.chat.websocket.buffer-size-limit=${CHAT_WEBSOCKET_BUFFER_SIZE_LIMIT_BYTES:1048576}
app.chat.websocket.allowed-origin-patterns=${CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:*}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
spring.data.redis.client-name=${REDIS_CLIENT_NAME:ai-learn}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_READ_TIMEOUT:5s}

# Database/JPA
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.jpa.repositories.enabled=false

# Flyway uses the datasource above
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
