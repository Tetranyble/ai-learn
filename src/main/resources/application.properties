spring.application.name=Ai-learn
spring.config.import=optional:file:./.env[.properties]
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=${OPENAI_MODEL:gpt-4o}
langchain4j.open-ai.chat-model.timeout=${OPENAI_TIMEOUT:60s}
langchain4j.open-ai.chat-model.max-retries=${OPENAI_MAX_RETRIES:2}
langchain4j.open-ai.chat-model.max-completion-tokens=${OPENAI_MAX_COMPLETION_TOKENS:1000}
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false
app.chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:20}

# Database/JPA
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.jpa.repositories.enabled=false

# Flyway uses the datasource above
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
